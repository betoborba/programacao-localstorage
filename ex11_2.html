<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatro Show Musical - Reserva de Poltronas</title>
         <link rel="icon" href="img/">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="row">
        <div class="col-sm-3">
            <img src="img/ex11_2.jpg" alt="Teatro" class="img-fluid">
        </div>
        <div class="col-sm-9">
            <h1>Teatro: Show Musical - Reserva de Poltronas</h1>
            <form>
                <div class="row">
                    <div class="col-sm-2">
                        <p><label for="inPoltrona">Nº da Poltrona:</label></p>
                        <input type="number" class="form-control" id="inPoltrona" min="1" required autofocus>
                    </p>
                    </div>
                    <div class="col-sm-4">
                        <input type="submit" class="btn btn-primary mt-4" value="Resevar">
                        <input type="button" class="btn btn-danger mt-4" value="Confirmar Reserva" id="btConfirmar">
                    </div>
                     <div class="col-sm-6">

                        Legenda:

                        <p class="mt-2">
                            <img src="img/legenda-disponivel.png" class="img-legenda">
                            Disponível

                            <img src="img/legenda-reservada.png" class="img-legenda ms-3">
                            Reservada

                            <img src="img/legenda-ocupada.png" class="img-legenda ms-3">
                            Ocupada
                        </p>

                    </div>
                </div>
            </form>
            <div class="row">
                <div class="col-sm-12" id="divPalco">
                    <p class="bg-primary text-white text-center">Palco do Teatro</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/ex11_2.js"></script>
</body>
</html>
